org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Ported from 1.20.1 Forge. This matches the toolchain Tetra Refreshed and Mutil Refreshed use,
# because it compiles against both, and a mismatch there surfaces as a mapping error rather than
# as a version error.
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.95
neo_version_range=[26.1,)
loader_version_range=[1,)

mod_id=art_of_forging
mod_name=Art Of Forging
mod_license=MIT
mod_version=1.8
mod_group_id=net.acetheeldritchking.art_of_forging
mod_authors=AceTheEldritchKing, MindFaer
mod_credits=Original mod by AceTheEldritchKing and MindFaer. 26.1.2 NeoForge port by EternalHell.
mod_description=An addon for Secrets of Forging: Revelations, which is itself an addon for Tetra. Created by Ace The Eldritch King and MindFaer. Adds many new and unique modules, from rapiers to maces and even pop culture weapons.

# This is an addon for Secrets of Forging, which is itself an addon for Tetra. Its schematics
# target polearm slots, so it has to load after it.
sofr_version_range=[1.3.5,)

tetra_version=26.1.2-6.13.0
tetra_version_range=[6.13.0,)
mutil_version=26.1.2-7.0.0-pre.0
mutil_version_range=[7.0.0,)

# EMI Refreshed, a fork, because upstream EMI stops at 1.21.1. Compile only and resolved from
# mavenLocal, the same as Tetra does it. A pack without EMI never loads the plugin.
emi_version=1.1.24-351ba8a4+26.1.2

# Curios is a real dependency rather than an optional one: seven curio effects and the modular
# artifact all name it. The pack ships curios-neoforge-15.0.0+26.1.2.
curios_version=15.0.0+26.1.2
curios_version_range=[15.0,)
